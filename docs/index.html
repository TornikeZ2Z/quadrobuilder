<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>QuadroBuilder Reporting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  color-scheme: light;
  --ground:#F4F2EF; --panel:#FFFFFF; --sunken:#EDEAE5; --hover:#FAF9F7;
  --line:#E5E1DB; --line-2:#F0EDE8;
  /* --ink-3 carries nearly every label on the page (KPI captions, table headers,
     filter labels), all of it small text, so it must clear WCAG AA 4.5:1 on BOTH
     the white panels and the warm ground. #8F97A1 managed only 2.95 / 2.64. */
  --ink:#2C333A; --ink-2:#4A525C; --ink-3:#646C77;
  --brand:#F26F20; --brand-soft:#FDEBE0; --brand-deep:#B44A0D;
  --cost:#C9C3BA;
  --crit:#A82B2A; --crit-bg:#FBEBEA;
  --warn:#7C5700; --warn-bg:#FAF1DC;
  --good:#166B4C; --good-bg:#E7F4EF;
  --side:238px;
}
*{box-sizing:border-box}
/* The filter bar is sticky, so anchored jumps must stop short of it or the
   section heading lands underneath. Covers nav links and pager jumps alike. */
html{scroll-padding-top:96px}
@media (max-width:900px){html{scroll-padding-top:132px}}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans Georgian","Archivo",system-ui,sans-serif; font-size:16.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2{font-family:"Archivo",sans-serif; margin:0; letter-spacing:-.015em; text-wrap:balance}
:lang(ka) h1,:lang(ka) h2{font-family:"Noto Sans Georgian","Archivo",sans-serif; letter-spacing:-.005em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.num{font-family:"Noto Sans Georgian","Archivo",sans-serif; font-variant-numeric:tabular-nums;
  font-weight:600}
a{color:var(--brand-deep)}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:3px}

/* shell */
.app{display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:100vh}
.side{position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--panel);
  border-right:1px solid var(--line); padding:22px 0 24px; display:flex; flex-direction:column; gap:20px}
.brand{padding:0 20px; display:flex; flex-direction:column; gap:9px}
.brand svg{display:block}
.brand .tag{font-family:"Archivo",sans-serif; font-size:11px; letter-spacing:.14em; font-weight:700;
  color:var(--ink-3); text-transform:uppercase}
:lang(ka) .brand .tag{font-family:"Noto Sans Georgian",sans-serif; letter-spacing:.08em; font-size:11px}
.langsel{padding:0 20px}
.langsel .seg{width:100%}
.langsel .seg button{flex:1; justify-content:center}
.nav{display:flex; flex-direction:column; gap:1px; padding:0 12px}
.nav a{display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:6px; text-decoration:none;
  color:var(--ink-2); font-size:14.5px; line-height:1.3}
.nav a:hover{background:var(--hover); color:var(--ink)}
.nav a[aria-current="true"]{background:var(--ink); color:#fff}
.nav a[aria-current="true"] .dot,
.nav a[aria-current="true"]:hover .dot{background:var(--brand)}
.nav .dot{width:5px; height:5px; border-radius:99px; background:var(--line); flex:none}
.nav a:hover .dot{background:var(--ink-3)}
.sidefoot{margin-top:auto; padding:0 20px; font-family:"IBM Plex Mono",monospace; font-size:11px;
  line-height:1.95; color:var(--ink-3); letter-spacing:.04em}
:lang(ka) .sidefoot{font-family:"Noto Sans Georgian",sans-serif; font-size:12px; letter-spacing:0}
.sidefoot b{color:var(--ink); font-weight:500}
.main{min-width:0; padding:0 0 90px}
.inner{max-width:none; margin:0; padding:26px 34px 0; display:flex; flex-direction:column; gap:36px}

/* filters */
.filters{position:sticky; top:0; z-index:30; background:var(--ground);
  border-bottom:1px solid var(--line); padding:13px 0}
.filters-inner{max-width:none; margin:0; padding:0 34px; display:flex; flex-wrap:wrap;
  gap:10px 18px; align-items:center}
.fgroup{display:flex; align-items:center; gap:8px}
.flab{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3)}
:lang(ka) .flab{font-family:"Noto Sans Georgian",sans-serif; letter-spacing:.02em; text-transform:none;
  font-size:13px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--panel)}
.seg button{appearance:none; border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  font-family:"IBM Plex Mono",monospace; font-size:13px; padding:6px 12px; border-right:1px solid var(--line)}
:lang(ka) .seg button{font-family:"Noto Sans Georgian",sans-serif; font-size:13.5px}
/* Always Georgian text, whatever the UI language. */
#f-lang button{font-family:"Noto Sans Georgian",sans-serif}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink); color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:var(--hover)}
/* The clip rect is load-bearing (it rounds the end buttons), so the focus
   ring has to be drawn inside it. */
.seg button:focus-visible{outline:none; box-shadow:inset 0 0 0 2px var(--ink); border-radius:3px}
.seg button[aria-pressed="true"]:focus-visible{box-shadow:inset 0 0 0 2px var(--panel)}
.daterange{display:none}
.daterange.on{display:inline-flex; align-items:center; gap:2px; padding:2px 2px 2px 9px;
  background:var(--panel); border:1px solid var(--line); border-radius:9px;
  box-shadow:0 1px 2px rgba(44,51,58,.05)}
.daterange:focus-within{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
.daterange .cal{width:15px; height:15px; flex:none; color:var(--ink-3)}
.daterange:focus-within .cal{color:var(--brand)}
.dr-trigger{appearance:none; border:0; background:transparent; cursor:pointer; display:flex;
  align-items:center; gap:8px; padding:5px 8px; border-radius:7px; color:var(--ink);
  font-family:"IBM Plex Mono",monospace; font-size:15px; font-variant-numeric:tabular-nums}
:lang(ka) .dr-trigger{font-family:"Noto Sans Georgian",sans-serif}
.dr-trigger:hover{background:var(--hover)}
.dr-sep{color:var(--ink-3); padding:0 2px}

/* two-month range calendar */
.dr-panel{position:absolute; top:calc(100% + 8px); left:0; z-index:70; display:none;
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 12px 40px rgba(44,51,58,.16); padding:14px; width:max-content;
  max-width:calc(100vw - 32px)}
.dr-panel.open{display:block}
.dr-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.dr-nav{appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--ink-2);
  width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:15px; line-height:1;
  display:flex; align-items:center; justify-content:center; flex:none}
.dr-nav:hover:not(:disabled){background:var(--ink); color:#fff; border-color:var(--ink)}
.dr-nav:disabled{opacity:.3; cursor:default}
.dr-titles{display:flex; gap:26px; flex:1; justify-content:space-around;
  font-family:"Archivo",sans-serif; font-weight:600; font-size:14.5px}
:lang(ka) .dr-titles{font-family:"Noto Sans Georgian",sans-serif}
.dr-body{display:flex; gap:18px; align-items:flex-start}
.dr-presets{display:flex; flex-direction:column; gap:2px; padding-right:16px;
  border-right:1px solid var(--line-2); min-width:132px}
.dr-preset{appearance:none; border:0; background:transparent; text-align:left; cursor:pointer;
  padding:7px 10px; border-radius:7px; font-size:13.5px; color:var(--ink-2);
  font-family:"Noto Sans Georgian",sans-serif; white-space:nowrap}
.dr-preset:hover{background:var(--hover); color:var(--ink)}
.dr-preset[aria-pressed="true"]{background:var(--ink); color:#fff}
.dr-months{display:flex; gap:26px}
/* No column gap: the selected range has to read as one continuous band, not a
   row of separate chips. Rows stay spaced. */
.dr-grid{display:grid; grid-template-columns:repeat(7,34px); column-gap:0; row-gap:3px}
.dr-dow{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3);
  text-align:center; padding:4px 0 6px; text-transform:uppercase}
:lang(ka) .dr-dow{font-family:"Noto Sans Georgian",sans-serif; text-transform:none; font-size:11px}
.dr-day{appearance:none; border:0; background:transparent; height:32px; border-radius:8px;
  cursor:pointer; font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink);
  font-variant-numeric:tabular-nums; position:relative}
.dr-day:hover:not(:disabled){background:var(--sunken)}
.dr-day:disabled{color:var(--line); cursor:default}
.dr-day.out{visibility:hidden}
.dr-day.in{background:var(--brand-soft); border-radius:0}
.dr-day.edge{background:var(--brand); color:#fff; font-weight:600}
.dr-day.edge.start{border-radius:8px 0 0 8px}
.dr-day.edge.end{border-radius:0 8px 8px 0}
.dr-day.edge.only{border-radius:8px}
.dr-day.today:not(.edge)::after{content:''; position:absolute; left:50%; bottom:4px;
  width:4px; height:4px; margin-left:-2px; border-radius:99px; background:var(--brand)}
.dr-day:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}
.dr-foot{display:flex; align-items:center; justify-content:space-between; gap:14px;
  margin-top:12px; padding-top:11px; border-top:1px solid var(--line-2)}
.dr-hint{font-size:12.5px; color:var(--ink-2)}
.dr-clear{appearance:none; border:1px solid var(--line); background:var(--panel); cursor:pointer;
  border-radius:7px; padding:5px 12px; font-size:12.5px; color:var(--ink-2);
  font-family:"Noto Sans Georgian",sans-serif}
.dr-clear:hover{background:var(--ink); color:#fff; border-color:var(--ink)}
@media (max-width:820px){.dr-body{flex-direction:column}
  .dr-presets{flex-direction:row; flex-wrap:wrap; border-right:0; padding-right:0;
    border-bottom:1px solid var(--line-2); padding-bottom:10px; width:100%}}
@media (max-width:640px){.dr-months{flex-direction:column; gap:14px}
  .dr-titles{gap:0}.dr-panel{left:auto; right:0}}
input[type=search]{font-family:"Noto Sans Georgian",sans-serif; font-size:16px; color:var(--ink);
  background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 10px; width:190px}
.reset{appearance:none; background:none; border:0; color:var(--brand-deep); cursor:pointer; font-size:13.5px;
  font-family:"IBM Plex Mono",monospace; padding:4px}
:lang(ka) .reset{font-family:"Noto Sans Georgian",sans-serif}
.scope{font-size:13px; color:var(--ink-2); font-family:"IBM Plex Mono",monospace}
:lang(ka) .scope{font-family:"Noto Sans Georgian",sans-serif; font-size:13.5px}
.scope b{color:var(--ink); font-weight:500}

/* combobox */
.combo{position:relative}
.combo-btn{display:inline-flex; align-items:center; gap:9px; background:var(--panel);
  border:1px solid var(--line); border-radius:6px; padding:6px 11px; cursor:pointer;
  font-family:"Noto Sans Georgian",sans-serif; font-size:14px; color:var(--ink); max-width:300px}
.combo-btn:hover{border-color:var(--ink-3)}
.combo-btn .lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.combo-btn .cnt{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3)}
.combo-btn .car{margin-left:auto; color:var(--ink-3); font-size:10px}
.combo-btn[aria-expanded="true"]{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
.combo-panel{position:absolute; top:calc(100% + 6px); left:0; width:min(360px,calc(100vw - 32px)); background:var(--panel);
  border:1px solid var(--line); border-radius:9px; box-shadow:0 8px 28px rgba(44,51,58,.14);
  z-index:60; display:none; overflow:hidden}
.combo-panel.open{display:block}
input.combo-search{width:100%; border:0; border-bottom:1px solid var(--line); border-radius:0;
  padding:10px 13px; font-size:16px; background:var(--panel); color:var(--ink);
  font-family:"Noto Sans Georgian",sans-serif}
input.combo-search:focus{outline:none; border-bottom-color:var(--brand)}
.combo-list{max-height:330px; overflow-y:auto; padding:4px}
.combo-opt{display:grid; grid-template-columns:1fr auto; gap:3px 10px; align-items:center;
  padding:8px 10px; border-radius:6px; cursor:pointer}
.combo-opt:hover{background:var(--hover)}
.combo-opt.active{background:var(--brand-soft); box-shadow:inset 0 0 0 2px var(--brand)}
.combo-opt[aria-selected="true"]{background:var(--ink)}
.combo-opt[aria-selected="true"] .cname,.combo-opt[aria-selected="true"] .crev{color:#fff}
.combo-opt[aria-selected="true"] .cbar i{background:var(--brand)}
.cname{font-size:14px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.crev{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); white-space:nowrap}
.cbar{grid-column:1/-1; height:3px; border-radius:2px; background:var(--sunken); overflow:hidden}
.cbar i{display:block; height:100%; background:var(--cost); border-radius:2px}
.combo-none{padding:15px; text-align:center; color:var(--ink-3); font-size:13.5px}

/* blocks */
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:9px}
:lang(ka) .eyebrow{font-family:"Noto Sans Georgian",sans-serif; letter-spacing:.02em;
  text-transform:none; font-size:13.5px}
section h2{font-size:23px; font-weight:600; margin-bottom:6px}
section > .lede{color:var(--ink-2); font-size:15.5px; max-width:84ch; margin:0 0 20px}
/* Chart panels are full-bleed, so their intro copy should be too - an 84ch
   cap leaves it looking like a half-width column under a full-width graph. */
#rhythm .lede,#rhythm .legend{max-width:none}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px 24px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(580px,1fr)); gap:18px}
/* Without this the grid items take their content-based minimum (the widest
   nowrap table) and push the whole page sideways on a phone. */
.grid2>*{min-width:0}
.head-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(166px,1fr));
  background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.kpi{padding:16px 18px; border-right:1px solid var(--line); border-top:1px solid var(--line);
  margin-top:-1px; display:flex; flex-direction:column; gap:3px}
.kpi:last-child{border-right:0}
.kpi .lab{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}
:lang(ka) .kpi .lab{font-family:"Noto Sans Georgian",sans-serif; letter-spacing:.01em;
  text-transform:none; font-size:13px}
.kpi .val{font-size:30px; line-height:1.2}
.kpi .val small{font-size:16px; font-weight:500; color:var(--ink-2)}
.kpi .ctx{font-size:13px; color:var(--ink-2); line-height:1.45}
.delta{font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:500}
:lang(ka) .delta{font-family:"Noto Sans Georgian",sans-serif}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.flat{color:var(--ink-3)}

/* tables */
.tw{overflow-x:auto; margin:0 -24px; padding:0 24px}
table{border-collapse:collapse; width:100%; font-size:14.5px}
/* Headers wrap to two short lines and centre over their column, so a wide table
   fits the panel instead of forcing a horizontal scroll. */
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.03em; text-transform:uppercase;
  color:var(--ink-3); text-align:center; font-weight:400; padding:0 7px 9px;
  border-bottom:1px solid var(--line); white-space:normal; vertical-align:bottom;
  line-height:1.25; hyphens:auto; overflow-wrap:anywhere; max-width:96px}
:lang(ka) th{font-family:"Noto Sans Georgian",sans-serif; text-transform:none; letter-spacing:0; font-size:12px}
th:first-child{text-align:left; padding-left:0; max-width:none}
th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--ink)}
th .arrow{opacity:.35; font-size:10px; margin-left:2px}
.sortbtn{appearance:none; border:0; background:none; padding:0; margin:0; cursor:pointer;
  font:inherit; color:inherit; letter-spacing:inherit; text-transform:inherit; text-align:inherit}
.sortbtn:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:2px}
th[aria-sort] .arrow{opacity:1; color:var(--brand)}
td{padding:9px 7px; border-bottom:1px solid var(--line-2); text-align:center; vertical-align:middle;
  font-variant-numeric:tabular-nums; white-space:nowrap}
td:first-child{text-align:left; white-space:nowrap; padding-left:0; padding-right:12px; line-height:1.3}
td.tleft{text-align:left}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:none}
/* Names are long and Georgian: clip to one line and put the full string in the
   title, so every row is the same height and the table stays scannable. */
/* Only the inner spans clip. A td.pname must stay display:table-cell or the
   whole row loses its grid. */
span.pname,.pmeta,.tcell{display:block; max-width:var(--namew,330px); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.pname{font-weight:500}
td.pname{max-width:none}
/* .pmeta holds category and supplier, which come from Optimo and are ALWAYS
   Georgian whatever the UI language is. IBM Plex Mono has no Georgian glyphs,
   so this must never be monospace - not even in English. */
.pmeta{font-size:12.5px; color:var(--ink-3); font-family:"Noto Sans Georgian",sans-serif; margin-top:1px}
.tcell{font-size:12.5px; color:var(--ink-2); max-width:var(--supw,124px)}
td.namecell{max-width:var(--namew,240px)}
#t-prod,#t-order,#t-decide,#t-over,#t-dead{--namew:230px; --supw:118px}
#t-cat{--namew:300px}
@media (min-width:1500px){#t-prod,#t-over,#t-dead{--namew:340px; --supw:150px}
  #t-order,#t-decide{--namew:260px; --supw:132px}
  #t-cat{--namew:400px}}
td.empty,.empty{color:var(--ink-3); font-size:14.5px; padding:24px 8px; text-align:center;
  white-space:normal}
tfoot td{border-top:1px solid var(--line); border-bottom:none; font-weight:600; padding-top:11px; color:var(--ink)}

.pager{display:flex; align-items:center; gap:7px; margin-top:15px; flex-wrap:wrap;
  font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink-2)}
:lang(ka) .pager{font-family:"Noto Sans Georgian",sans-serif; font-size:13.5px}
.pager button{appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--ink-2);
  border-radius:5px; padding:5px 11px; cursor:pointer; font-family:inherit; font-size:inherit; min-width:34px}
.pager button:hover:not(:disabled){background:var(--sunken); color:var(--ink)}
.pager button:disabled{opacity:.35; cursor:default}
.pager button[aria-current="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.pager .gap{color:var(--ink-3); padding:0 2px}
.pager .count{margin-left:auto}

.btn{appearance:none; display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); border-radius:6px; padding:7px 14px; cursor:pointer;
  font-family:"IBM Plex Mono",monospace; font-size:13px; white-space:nowrap}
:lang(ka) .btn{font-family:"Noto Sans Georgian",sans-serif; font-size:13.5px}
.btn:hover{background:var(--ink); color:#fff; border-color:var(--ink)}
.btn svg{width:14px; height:14px; flex:none}

.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  font-family:"IBM Plex Mono",monospace; font-size:12px; white-space:nowrap}
:lang(ka) .chip{font-family:"Noto Sans Georgian",sans-serif; font-size:12.5px}
.chip.crit{background:var(--crit-bg); color:var(--crit)}
.chip.warn{background:var(--warn-bg); color:var(--warn)}
.chip.good{background:var(--good-bg); color:var(--good)}
.chip .dot{width:5px;height:5px;border-radius:99px;background:currentColor;flex:none}
/* A chip is a label, not a figure - it belongs against the left edge of its
   cell rather than floating in the middle of the column. */
td:has(> .chip){text-align:left}
td.chipcell{text-align:left}

.bar{display:block; height:5px; border-radius:2px; background:#DFDAD2; overflow:hidden;
  min-width:44px; max-width:76px; margin:4px auto 0}
.bar i{display:block; height:100%; border-radius:2px}

.callout{background:var(--panel); border:1px solid var(--crit); border-radius:10px; padding:22px 24px;
  display:flex; flex-direction:column; gap:11px}
.callout h2{color:var(--crit); font-size:22px}
.callout .big{font-size:clamp(24px,3vw,33px); font-weight:700;
  font-family:"Noto Sans Georgian","Archivo",sans-serif;
  color:var(--crit); font-variant-numeric:tabular-nums; line-height:1.15}
.callout p{margin:0; font-size:15.5px; max-width:86ch}

/* This-week strip: today as the hero figure, the rest of the week beside it.
   Bars are plain divs rather than SVG - no font-embedding worries for the
   Georgian day names, and it reflows without a viewBox to recompute. */
.wk{display:grid; grid-template-columns:minmax(0,260px) minmax(0,1fr); gap:26px; align-items:stretch}
.wk>*{min-width:0}
.wk-today{display:flex; flex-direction:column; justify-content:center;
  padding:18px 20px; background:var(--ground); border-radius:10px}
.wk-today .day{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3)}
:lang(ka) .wk-today .day{font-family:"Noto Sans Georgian",sans-serif; letter-spacing:.01em;
  text-transform:none; font-size:12.5px}
.wk-today .big{font-size:42px; line-height:1.12; color:var(--brand-deep); margin-top:6px}
.wk-today .sub{font-size:13px; color:var(--ink-2); line-height:1.5; margin-top:8px}
.wk-today .partial{font-size:12px; color:var(--ink-3); margin-top:8px; font-style:italic}

.wk-days{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; align-items:end}
.wk-col{display:flex; flex-direction:column; justify-content:flex-end; gap:6px; min-width:0}
.wk-amt{font-size:12px; color:var(--ink-2); text-align:center; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.wk-bar{background:var(--brand); border-radius:4px 4px 0 0; min-height:3px;
  transition:background .15s}
.wk-col.is-today .wk-bar{background:var(--brand-deep)}
.wk-col.is-today .wk-amt{color:var(--ink); font-weight:700}   /* must outrank .num's 600 */
.wk-col.future .wk-bar{background:var(--line)}
.wk-col.future .wk-amt{color:var(--ink-3)}
.wk-dow{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3);
  text-align:center; padding-top:7px; border-top:1px solid var(--line)}
:lang(ka) .wk-dow{font-family:"Noto Sans Georgian",sans-serif; font-size:11.5px}
.wk-col.is-today .wk-dow{color:var(--ink); font-weight:500}
.wk-foot{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px 26px; align-items:baseline;
  border-top:1px solid var(--line); padding-top:14px; font-size:14px; color:var(--ink-2)}
.wk-foot b{color:var(--ink); font-weight:500}
@media (max-width:760px){
  .wk{grid-template-columns:1fr; gap:18px}
  .wk-today .big{font-size:34px}
  .wk-amt{font-size:10.5px}
}
.note{border-left:2px solid var(--brand); padding:11px 0 11px 16px; font-size:14px;
  color:var(--ink-2); margin:18px 0 0}
.note b{color:var(--ink); font-weight:500}
.note:empty{display:none}

.chartbox{position:relative}
svg{display:block; width:100%; overflow:visible}
.brand svg{width:158px}
.btn svg,.chip svg{width:14px}
.tip{position:absolute; pointer-events:none; opacity:0; transition:opacity .1s; background:var(--ink);
  color:#fff; border-radius:6px; padding:8px 11px; font-size:12.5px; font-family:"IBM Plex Mono",monospace;
  white-space:nowrap; z-index:20; transform:translate(-50%,-118%); line-height:1.6}
:lang(ka) .tip{font-family:"Noto Sans Georgian",sans-serif; font-size:13px}
.legend{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-3); margin:13px 0 0;
  display:flex; gap:18px; flex-wrap:wrap}
:lang(ka) .legend{font-family:"Noto Sans Georgian",sans-serif; font-size:13.5px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-top:20px}
.stat{background:var(--panel); padding:13px 15px; display:flex; flex-direction:column; gap:3px}
.stat .lab{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3)}
:lang(ka) .stat .lab{font-family:"Noto Sans Georgian",sans-serif; letter-spacing:.01em;
  text-transform:none; font-size:12.5px}
.stat .val{font-size:21px; font-weight:600; font-family:"Noto Sans Georgian","Archivo",sans-serif;
  font-variant-numeric:tabular-nums}
.stat .sub{font-size:12.5px; color:var(--ink-2)}

footer{border-top:1px solid var(--line); padding-top:22px; margin-top:8px; color:var(--ink-2);
  font-size:14px; display:flex; flex-direction:column; gap:10px}
footer b{color:var(--ink); font-weight:500}
footer ul{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:7px}

/* Six KPI tiles need ~996px of track; below that the auto-fit grid strands one
   tile on a second row (1280 showed 5+1). Drop to a clean 3x2 instead. */
@media (min-width:901px) and (max-width:1301px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line);
    flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:12px 16px}
  .nav{flex:1 0 100%; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:thin; padding-bottom:2px}
  .brand,.langsel{padding:0; flex:none}
  .nav{flex-direction:row; padding:0; gap:4px}
  .nav a{white-space:nowrap; font-size:13.5px; padding:7px 10px}
  .nav .dot{display:none}
  .sidefoot{display:none}
  .inner{padding:20px 16px 0; gap:28px}
  /* 278px of sticky chrome is a third of a phone screen; let it scroll away. */
  .filters{position:static}
  .filters-inner{padding:0 16px}
  /* Georgian segment labels are wide; let the groups wrap rather than push the
     page sideways. The Period row alone is 385px against a 375px phone. */
  .fgroup{flex-wrap:wrap; max-width:100%}
  .seg{flex-wrap:wrap; max-width:100%}
  .combo-btn{max-width:100%}
  input[type=search]{width:100%}
  .daterange{flex-wrap:wrap}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{border-bottom:1px solid var(--line)}
  .tw{margin:0 -16px; padding:0 16px}
  .panel{padding:16px}
}
</style>

function winRange(){
  const p=state.period;
  if(p==='custom') return [state.from||FIRST, state.to||ASOF_S];
  if(p==='all')    return [FIRST, ASOF_S];
  if(p==='tm'){const d=new Date(ASOF.getFullYear(),ASOF.getMonth(),1,12);
    return [isoOf(d), ASOF_S];}
  if(p==='lm'){const a=new Date(ASOF.getFullYear(),ASOF.getMonth()-1,1,12),
                     b=new Date(ASOF.getFullYear(),ASOF.getMonth(),0,12);
    return [isoOf(a), isoOf(b)];}
  const d=new Date(ASOF); d.setDate(d.getDate()-Number(p)+1);
  return [d.toISOString().slice(0,10), ASOF_S];}
const isoOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const matches=(l,from,to)=>l.d>=from&&(!to||l.d<=to)&&(!state.chan||l.ch===state.chan)&&
  (!state.cat||l.c===state.cat)&&(!state.q||l.p.toLowerCase().includes(state.q)||String(l.b).includes(state.q));
const activeLines=()=>{const r=winRange(); return LINES.filter(l=>matches(l,r[0],r[1]));};
function prevLines(){if(state.period==='all')return null;
  const r=winRange(), n=dayDiff(r[0],r[1])+1;
  const end=new Date(r[0]+'T12:00:00'); end.setDate(end.getDate()-1);
  const st=new Date(end); st.setDate(st.getDate()-n+1);
  return LINES.filter(l=>matches(l,st.toISOString().slice(0,10),end.toISOString().slice(0,10)));}
const periodDays=()=>{const r=winRange(); return Math.max(1,dayDiff(r[0],r[1])+1);};

/* ---------- two-month range calendar ---------- */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2],12);};

function monthGrid(base){
  // Monday-first grid, 6 rows so the panel height never jumps between months
  const y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1,12), lead=(first.getDay()+6)%7;
  const cells=[];
  for(let i=0;i<42;i++){
    const d=new Date(y,m,1-lead+i,12);
    cells.push({d, out:d.getMonth()!==m});
  }
  return cells;
}
function dayClasses(d,out){
  const s=iso(d);
  const a=state.from, b=drPick?(drHover&&drHover<drPick?drHover:drHover||drPick):state.to;
  const lo=drPick?(drHover&&drHover<drPick?drHover:drPick):a;
  const hi=drPick?(drHover&&drHover<drPick?drPick:(drHover||drPick)):b;
  const cls=[];
  if(out) cls.push('out');
  if(lo&&hi&&s>lo&&s<hi) cls.push('in');
  if(s===lo||s===hi){cls.push('edge');
    if(lo===hi) cls.push('only'); else cls.push(s===lo?'start':'end');}
  if(s===iso(MAX_D)) cls.push('today');
  return cls.join(' ');
}

function catStats(){const r=winRange(), m=new Map();
  for(const l of LINES){ if(l.d<r[0]||l.d>r[1]) continue;
    if(state.chan&&l.ch!==state.chan) continue;
    if(state.q&&!(l.p.toLowerCase().includes(state.q)||String(l.b).includes(state.q))) continue;
    m.set(l.c,(m.get(l.c)||0)+l.v);}
  const rows=[...m.entries()].map(([c,rev])=>({c,rev})).sort((a,b)=>b.rev-a.rev);
  return {rows,max:Math.max(...rows.map(x=>x.rev),1),total:rows.reduce((a,x)=>a+x.rev,0)};}

function bucket(ds){const d=new Date(ds+'T12:00:00');
  if(state.gran==='D') return ds;
  if(state.gran==='W'){const o=(d.getDay()+6)%7; d.setDate(d.getDate()-o); return d.toISOString().slice(0,10);}
  if(state.gran==='M') return ds.slice(0,7);
  return d.getFullYear()+'-Q'+(Math.floor(d.getMonth()/3)+1);}
const MON=d=>T('mon_'+(d.getMonth()+1));
function fmtDay(d){return LANG==='ka'?`${d.getDate()} ${MON(d)}`:`${d.getDate()} ${MON(d)}`;}
function fmtMon(d){return `${MON(d)} ${String(d.getFullYear()).slice(2)}`;}
function bucketLabel(k){
  if(state.gran==='D'||state.gran==='W') return fmtDay(new Date(k+'T12:00:00'));
  if(state.gran==='M') return fmtMon(new Date(k+'-01T12:00:00'));
  const q=k.split('-Q'); return T('q_label',q[1],q[0].slice(2));}
function totals(rows){const t={rev:0,cogs:0,units:0,rs:new Set(),ret:0};
  for(const l of rows){t.rev+=l.v; t.cogs+=l.q*l.u; t.units+=l.q;
    if(l.v>0)t.rs.add(l.ch+l.r); if(l.ret)t.ret+=l.lv;}
  t.receipts=t.rs.size; t.margin=t.rev-t.cogs;
  t.mpct=t.rev>0?100*t.margin/t.rev:0; t.basket=t.receipts?t.rev/t.receipts:0; return t;}
function groupBy(rows,fn){const m=new Map();
  for(const l of rows){const k=fn(l); if(!m.has(k))m.set(k,[]); m.get(k).push(l);} return m;}
function byProduct(rows){const out=[];
  for(const e of groupBy(rows,l=>l.b)){const b=e[0], ls=e[1];
    const t=totals(ls), st=STOCK_BY[b];
    out.push({b,p:ls[0].p,c:ls[0].c,sup:ls[0].sup,rev:t.rev,units:t.units,margin:t.margin,mpct:t.mpct,
      txns:t.receipts,on_hand:st?st.q:0,capital:st?st.t:0});}
  return out;}

/* ---- minimal .xlsx writer: store-only ZIP + inline strings, no libraries ---- */
const CRC=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  return t;})();
function crc32(u8){let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;}
const enc=new TextEncoder();
function zip(files){
  const parts=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.data), crc=crc32(data);
    const hdr=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(hdr,name,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),
      ...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),
      ...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=hdr.length+name.length+data.length;}
  let clen=0; central.forEach(c=>clen+=c.length);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),
    ...u16(files.length),...u32(clen),...u32(off),...u16(0)]);
  const all=[...parts,...central,end];
  let total=0; all.forEach(p=>total+=p.length);
  const out=new Uint8Array(total); let o=0;
  for(const p of all){out.set(p,o); o+=p.length;}
  return out;}
const xesc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');

function sheetXML(rows,cols){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>';
  cols.forEach((c,i)=>{x+=`<col min="${i+1}" max="${i+1}" width="${c.w||16}" customWidth="1"/>`;});
  x+='</cols><sheetData><row r="1">';
  cols.forEach((c,i)=>{x+=`<c r="${colName(i)}1" t="inlineStr" s="1"><is><t>${xesc(c.l)}</t></is></c>`;});
  x+='</row>';
  rows.forEach((r,ri)=>{x+=`<row r="${ri+2}">`;
    cols.forEach((c,i)=>{const raw=typeof c.v==='function'?c.v(r):r[c.v];
      const ref=colName(i)+(ri+2);
      if(raw==null||raw===''){x+=`<c r="${ref}"/>`;}
      else if(typeof raw==='number'&&isFinite(raw)){x+=`<c r="${ref}"><v>${raw}</v></c>`;}
      else{x+=`<c r="${ref}" t="inlineStr"><is><t>${xesc(raw)}</t></is></c>`;}});
    x+='</row>';});
  return x+'</sheetData></worksheet>';}

const emptyBody=(cols,msg)=>`<tbody><tr><td class="empty" colspan="${cols}">${msg}</td></tr></tbody>`;
const PAGE=12;
function paginate(rows,key){const pages=Math.max(1,Math.ceil(rows.length/PAGE));
  if(state.page[key]>pages)state.page[key]=pages;
  const p=state.page[key];
  return {slice:rows.slice((p-1)*PAGE,p*PAGE),page:p,pages,total:rows.length,
    from:rows.length?(p-1)*PAGE+1:0,to:Math.min(p*PAGE,rows.length)};}
function drawPager(id,info,key){const n=el(id); if(!n)return;
  if(info.total<=PAGE){n.innerHTML=info.total?
    `<span class="count">${info.total===1?T('pg_row',info.total):T('pg_rows',info.total)}</span>`:''; return;}
  const p=info.page, pages=info.pages, nums=[];
  nums.push(1); if(p>3)nums.push('…');
  for(let i=Math.max(2,p-1);i<=Math.min(pages-1,p+1);i++)nums.push(i);
  if(p<pages-2)nums.push('…'); if(pages>1)nums.push(pages);
  n.innerHTML=`<button type="button" data-go="${p-1}" ${p===1?'disabled':''}>${T('pg_prev')}</button>`+
    nums.map(v=>v==='…'?`<span class="gap">…</span>`
      :`<button type="button" data-go="${v}" aria-current="${v===p}">${v}</button>`).join('')+
    `<button type="button" data-go="${p+1}" ${p===pages?'disabled':''}>${T('pg_next')}</button>`+
    `<span class="count">${T('pg_of',info.from,info.to,info.total)}</span>`;
  n.onclick=e=>{const b=e.target.closest('button[data-go]'); if(!b||b.disabled)return;
    state.page[key]=Number(b.dataset.go); render();
    n.closest('section').scrollIntoView({block:'start',behavior:'instant'});};}
function sortRows(rows,key){const s=key&&state.sort[key]; if(!s)return rows;
  return rows.slice().sort((a,b)=>{const x=a[s.k],y=b[s.k];
    if(typeof x==='string')return s.dir*x.localeCompare(y,'ka');
    return s.dir*((x==null?-Infinity:x)-(y==null?-Infinity:y));});}
function headers(cols,key){return '<thead><tr>'+cols.map(c=>{
    const s=key&&state.sort[key], on=s&&s.k===c.k;
    // A real <button> inside the th: keyboard-reachable, and the click still
    // bubbles to the th that carries the sort handler.
    const inner=c.k
      ? `<button type="button" class="sortbtn">${c.l}<span class="arrow">${on?(s.dir<0?'▼':'▲'):'⇅'}</span></button>`
      : c.l;
    return `<th ${c.k?`class="sortable" data-sort="${c.k}"`:''}${on?` aria-sort="${s.dir<0?'descending':'ascending'}"`:''}>${inner}</th>`;
  }).join('')+'</tr></thead>';}
function wireSort(tableId,key){el(tableId).querySelectorAll('th[data-sort]').forEach(th=>{
  th.onclick=()=>{const k=th.dataset.sort,s=state.sort[key];
    state.sort[key]=s&&s.k===k?{k,dir:-s.dir}:{k,dir:-1}; state.page[key]=1; render();};});}

function wireTip(host,tipEl,nodes,html,anchors){nodes.forEach((n,i)=>{n.style.cursor='crosshair';
  n.addEventListener('pointerenter',()=>{
    tipEl.innerHTML=html(i);
    // Anchor to the drawn mark, not the full-height hit rect, or the tip floats
    // far above the bar it describes.
    const a=(anchors&&anchors[i])||n;
    const hb=host.getBoundingClientRect(), b=n.getBoundingClientRect(), ab=a.getBoundingClientRect();
    const w=tipEl.offsetWidth, h=tipEl.offsetHeight;          // measured after innerHTML
    let L=b.left-hb.left+b.width/2;
    L=Math.min(Math.max(L,w/2+4),Math.max(w/2+4,hb.width-w/2-4));
    const flip=(ab.top-h*1.18)<hb.top;                        // no room above
    tipEl.style.transform=flip?'translate(-50%,18%)':'translate(-50%,-118%)';
    tipEl.style.left=L+'px';
    tipEl.style.top=((flip?ab.bottom:ab.top)-hb.top)+'px';
    tipEl.style.opacity=1;});
  n.addEventListener('pointerleave',()=>tipEl.style.opacity=0);});}

function drawTrend(bk){const host=el('trend'); host.innerHTML='';
  if(!bk.length){host.innerHTML=`<p class="empty">${T('no_sales_sel')}</p>`;return;}
  // One user unit == one CSS pixel, so label sizes stay constant at any width.
  const W=Math.max(360,Math.round(host.clientWidth)),PL=58,PR=14,PT=28,PB=48,H=284;
  const iw=W-PL-PR, ih=H-PT-PB, step=iw/bk.length;
  const bw=Math.max(1.5,Math.min(60,step-Math.min(14,step*0.28)));
  const every=Math.max(1,Math.ceil(bk.length/26));
  const showVals=bk.length<=34, rot=step<38;
  const max=Math.max(...bk.map(b=>Math.max(b.rev,b.cogs)))*1.16||1;
  const y=v=>PT+ih-(v/max)*ih;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,role:'img',preserveAspectRatio:'xMidYMid meet'});
  [0,.25,.5,.75,1].forEach(t=>{
    svg.appendChild(mk('line',{x1:PL,x2:W-PR,y1:y(max*t),y2:y(max*t),stroke:'var(--line-2)','stroke-width':1}));
    const tx=mk('text',{x:PL-9,y:y(max*t)+4,'text-anchor':'end',fill:'var(--ink-3)','font-size':11.5,
      'font-family':'IBM Plex Mono, monospace'}); tx.textContent=KF(max*t); svg.appendChild(tx);});
  const hit=[], tops=[];
  bk.forEach((b,i)=>{const x=PL+i*step+(step-bw)/2;
    const cogs=Math.max(0,b.cogs), marg=Math.max(0,b.margin);
    svg.appendChild(mk('rect',{x,y:y(cogs),width:bw,height:Math.max(0,ih-(y(cogs)-PT)),fill:'var(--cost)'}));
    if(marg>0) svg.appendChild(mk('rect',{x,y:y(cogs+marg),width:bw,
      height:Math.max(0,y(cogs)-y(cogs+marg)-2),fill:'var(--brand)'}));
    if(b.margin<0) svg.appendChild(mk('rect',{x,y:y(cogs),width:bw,height:6,fill:'var(--crit)'}));
    if(showVals){const v=mk('text',{x:x+bw/2,y:y(cogs+marg)-8,'text-anchor':'middle',fill:'var(--ink)',
      'font-size':11.5,'font-weight':600,'font-family':'IBM Plex Mono, monospace'});
      v.textContent=KF(b.rev); svg.appendChild(v);}
    const isLast=i===bk.length-1;
    if(i%every===0||(isLast&&(bk.length-1)%every>every/2)){
      const lx=x+bw/2, ly=PT+ih+(rot?13:17);
      // Tick labels are month names, which are Georgian by default - they must
      // not be asked for in a font with no Georgian coverage.
      const t=mk('text',{x:lx,y:ly,'text-anchor':rot?'end':'middle',fill:'var(--ink-3)','font-size':11,
        'font-family':GSANS});
      if(rot) t.setAttribute('transform',`rotate(-45 ${lx} ${ly})`);
      t.textContent=bucketLabel(b.k); svg.appendChild(t);}
    const h=mk('rect',{x,y:PT,width:bw,height:ih,fill:'transparent'}); svg.appendChild(h); hit.push(h);
    tops.push(mk('rect',{x,y:y(cogs+marg),width:bw,height:1,fill:'none'}));
    svg.appendChild(tops[tops.length-1]);});
  host.appendChild(svg);
  wireTip(host.parentNode,el('trend-tip'),hit,i=>{const b=bk[i];
    return `<b>${bucketLabel(b.k)}</b><br>${T('tt_revenue')} ${F(b.rev,2)} ₾<br>${T('tt_cost')} ${F(b.cogs,2)} ₾<br>${T('tt_margin')} ${F(b.margin,2)} ₾ (${F(b.mpct,1)}%)<br>${b.receipts} ${T('tt_receipts')}`;},tops);}

function drawMpct(bk){const host=el('mpct'); host.innerHTML=''; if(!bk.length)return;

function apply(){render();
  // .filters is sticky, so its offsetTop tracks scrollY and the old comparison
  // was always false. .inner is static, so it gives a real threshold.
  const anchor=document.querySelector('.inner');

/* The current ISO week (Mon-Sun) containing the as-of date. This block owns the
   date axis - it is "this week" by definition - so it ignores the period picker,
   but it still honours the channel / category / search filters like everything
   else on the page. */
function weekBounds(){
  const d=parse(ASOF_S);
  const dow=(d.getDay()+6)%7;                       // 0=Mon
  const mon=new Date(d.getTime()); mon.setDate(d.getDate()-dow);
  const sun=new Date(mon.getTime()); sun.setDate(mon.getDate()+6);
  return {mon,sun,from:iso(mon),to:iso(sun)};       // iso() reads local parts, not UTC
}

function renderWeek(){
  const host=el('wk'); if(!host) return;
  // Reuse the page's existing fmtDay, which takes a Date. Declaring a second
  // top-level fmtDay here silently overrode it and broke every Day/Week label
  // in the Rhythm section, so keep this local.
  const dayLabel=ds=>fmtDay(parse(ds));
  const wb=weekBounds();
  const rows=LINES.filter(l=>matches(l,wb.from,wb.to));
  const byDay=groupBy(rows,l=>l.d);

  // Same weekday last week, for an honest like-for-like comparison.
  const prevFrom=new Date(wb.mon.getTime()); prevFrom.setDate(prevFrom.getDate()-7);
  const prevTo=new Date(wb.sun.getTime());   prevTo.setDate(prevTo.getDate()-7);
  const prevRows=LINES.filter(l=>matches(l,iso(prevFrom),iso(prevTo)));
  const prevByDay=groupBy(prevRows,l=>l.d);

  const days=[];
  for(let i=0;i<7;i++){
    const dt=new Date(wb.mon.getTime()); dt.setDate(wb.mon.getDate()+i);
    const ds=iso(dt);
    const t=totals(byDay.get(ds)||[]);
    days.push({ds,dow:i+1,rev:t.rev,margin:t.margin,receipts:t.receipts,
               future:ds>ASOF_S, today:ds===ASOF_S});
  }
  const isLive=ASOF_S===iso(new Date());
  const peak=Math.max(1,...days.map(d=>d.rev));
  const today=days.find(d=>d.today)||days.filter(d=>!d.future).pop()||days[0];

  const back7=d=>{const x=parse(d); x.setDate(x.getDate()-7); return iso(x);};
  const pt=totals(prevByDay.get(back7(today.ds))||[]);
  const delta=(cur,prev)=>{ if(!prev) return `<span class="delta flat">${T('wk_nobase')}</span>`;
    const v=100*(cur-prev)/Math.abs(prev), cl=Math.abs(v)<0.5?'flat':v>0?'up':'down';
    return `<span class="delta ${cl}">${v>0?'+':''}${F(v,1)}% ${T('wk_vs_lastweek')}</span>`; };

  const wtd=days.reduce((a,d)=>a+d.rev,0);
  const wtdMargin=days.reduce((a,d)=>a+d.margin,0);
  // Compare like with like: only last week's days up to the same weekday.
  const prevWtd=[...prevByDay.entries()]
    .filter(([ds])=>ds<=back7(today.ds))
    .reduce((a,[,ls])=>a+totals(ls).rev,0);

  host.innerHTML=
    `<div class="wk-today">
       <span class="day">${T('dow_'+today.dow)} · ${dayLabel(today.ds)}</span>
       <span class="big num">${GEL(today.rev)}</span>
       <span class="sub">${T('wk_margin_receipts',GEL(today.margin),F(today.receipts))}</span>
       <span class="sub">${delta(today.rev,pt.rev)}</span>
       <span class="partial">${isLive?T('wk_partial'):T('wk_stale',dayLabel(ASOF_S))}</span>
     </div>
     <div>
       <div class="wk-days">${days.map(d=>`
         <div class="wk-col ${d.today?'is-today':''} ${d.future?'future':''}"
              title="${T('dow_'+d.dow)} ${dayLabel(d.ds)} — ${d.future?T('wk_nodata'):GEL(d.rev)}">
           <span class="wk-amt num">${d.future?'—':F(d.rev,0)}</span>
           <div class="wk-bar" style="height:${d.future?3:Math.max(3,Math.round(96*d.rev/peak))}px"></div>
           <span class="wk-dow">${T('dw_'+d.dow)}</span>
         </div>`).join('')}</div>
     </div>
     <div class="wk-foot">
       <span>${T('wk_total')} <b class="num">${GEL(wtd)}</b></span>
       <span>${T('wk_margin_total')} <b class="num">${GEL(wtdMargin)}</b></span>
       ${prevWtd?`<span>${delta(wtd,prevWtd)}</span>`:''}
     </div>`;
}

function render(){
  ['gran','chan'].forEach((key,i)=>{const id=['f-gran','f-chan'][i];
    [...el(id).children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===state[key]));});
  [...el('f-lang').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  syncRange(); renderCombo();

  const rows=activeLines(), prev=prevLines(), Tt=totals(rows), P=prev?totals(prev):null, days=periodDays();
  el('f-scope').innerHTML=`<b>${F(rows.length)}</b> ${T('s_lines')} · <b>${F(Tt.receipts)}</b> ${T('s_receipts')} · <b>${F(days)}</b> ${T('s_days')}`;

  const dl=(c,p)=>{if(P===null||!p)return'';
    const v=100*(c-p)/Math.abs(p), cl=Math.abs(v)<0.5?'flat':v>0?'up':'down';
    return `<span class="delta ${cl}">${v>0?'+':''}${F(v,1)}% ${T('vs_prev')}</span>`;};
  el('kpis').innerHTML=[
    {lab:T('k_revenue'),val:GEL(Tt.rev),ctx:dl(Tt.rev,P&&P.rev)||T('lines_n',F(rows.length))},
    {lab:T('k_margin'),val:GEL(Tt.margin),ctx:dl(Tt.margin,P&&P.margin)||T('on_goods',GEL(Tt.cogs))},
    {lab:T('k_marginpct'),val:F(Tt.mpct,1),unit:'%',ctx:(P&&dl(Tt.mpct,P.mpct))||T('cost_of_goods',GEL(Tt.cogs))},
    {lab:T('k_receipts'),val:F(Tt.receipts),ctx:dl(Tt.receipts,P&&P.receipts)||T('units_n',F(Tt.units,0))},
    {lab:T('k_basket'),val:GEL(Tt.basket),ctx:dl(Tt.basket,P&&P.basket)||T('units_sold',F(Tt.units,0))},
    {lab:T('k_returned'),val:GEL(Tt.ret),
     ctx:T('pct_gross_excl',(Tt.rev+Tt.ret)>0?F(100*Tt.ret/(Tt.rev+Tt.ret),1):'0')},
  ].map(k=>`<div class="kpi"><span class="lab">${k.lab}</span>
    <span class="val num">${k.val}${k.unit?`<small>${k.unit}</small>`:''}</span>
    <span class="ctx">${k.ctx}</span></div>`).join('');

  renderWeek();

  const wr=winRange(), opt=OPTIMO.filter(o=>o.d>=wr[0]&&o.d<=wr[1]).reduce((a,o)=>a+o.rev,0);
  el('recon').innerHTML=(!state.chan&&!state.cat&&!state.q)
    ? T('recon_ok',F(opt,2),F(Tt.rev,2),F(Tt.rev-opt,2))
    : T('recon_filtered',F(rows.length),F(LINES.length));

  const bk=[...groupBy(rows,l=>bucket(l.d)).entries()].sort((a,b)=>a[0]<b[0]?-1:1)
    .map(e=>Object.assign({k:e[0]},totals(e[1])));
  drawTrend(bk); drawMpct(bk);

  const best=bk.reduce((a,b)=>b.rev>a.rev?b:a,bk[0]||{rev:0});
  const worst=bk.reduce((a,b)=>b.rev<a.rev?b:a,bk[0]||{rev:0});
  const growth=bk.length>1&&bk[0].rev>0?100*(bk[bk.length-1].rev-bk[0].rev)/bk[0].rev:null;
  const turn=TOTAL_STOCK>0?(Tt.cogs/(days/365))/TOTAL_STOCK:0;
  const gname=T({D:'n_day',W:'n_week',M:'n_month',Q:'n_quarter'}[state.gran]);
  el('rhythm-stats').innerHTML=[
    {lab:T('st_best',gname),val:GEL(best.rev||0),sub:best.k?bucketLabel(best.k):'—'},
    {lab:T('st_weak',gname),val:GEL(worst.rev||0),sub:worst.k?bucketLabel(worst.k):'—'},
    {lab:T('st_avg',gname),val:GEL(bk.length?Tt.rev/bk.length:0),sub:T('st_inview',bk.length)},
    {lab:T('st_firstlast'),val:growth==null?'—':`${growth>0?'+':''}${F(growth,0)}%`,
      sub:bk.length>1?`${bucketLabel(bk[0].k)} → ${bucketLabel(bk[bk.length-1].k)}`:'—'},
    {lab:T('st_turns'),val:F(turn,1)+'×',sub:T('st_heldcost',GEL(TOTAL_STOCK))},
    {lab:T('st_daysinv'),val:turn>0?F(365/turn,0):'—',sub:T('st_atrate')},
  ].map(s=>`<div class="stat"><span class="lab">${s.lab}</span><span class="val">${s.val}</span>
    <span class="sub">${s.sub}</span></div>`).join('');

  const prods=byProduct(rows).filter(p=>p.rev!==0);
  LAST.prods=sortRows(prods,'prod');
  const iP=paginate(LAST.prods,'prod'), maxM=Math.max(...prods.map(p=>p.mpct),1);
  el('t-prod').innerHTML=headers([{l:T('c_product')},{l:T('c_revenue'),k:'rev'},{l:T('c_units'),k:'units'},
    {l:T('c_sales'),k:'txns'},{l:T('c_margin_gel'),k:'margin'},{l:T('c_margin_pct'),k:'mpct'},
    {l:T('c_onhand'),k:'on_hand'}],'prod')+
    (iP.slice.length?`<tbody>${iP.slice.map(r=>`<tr>
      <td><span class="pname" title="${esc(r.p)}">${esc(r.p)}</span><span class="pmeta" title="${esc(r.c)}">${esc(r.c)}</span></td>
      <td class="mono">${F(r.rev,0)} ₾</td><td class="mono">${F(r.units,0)}</td><td class="mono">${r.txns}</td>
      <td class="mono">${F(r.margin,0)} ₾</td>
      <td><span class="mono" style="font-size:13px${r.mpct<0?';color:var(--crit)':''}">${F(r.mpct,1)}%</span>
        <span class="bar"><i style="width:${Math.max(2,Math.min(100,(r.mpct/maxM)*100))}%;background:${r.mpct<0?'var(--crit)':r.mpct<20?'var(--cost)':'var(--brand)'}"></i></span></td>
      <td class="mono">${F(r.on_hand,0)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>${T('n_products',F(prods.length))}</td><td class="mono">${F(Tt.rev,0)} ₾</td>
      <td class="mono">${F(Tt.units,0)}</td><td class="mono">${F(Tt.receipts)}</td>
      <td class="mono">${F(Tt.margin,0)} ₾</td><td class="mono">${F(Tt.mpct,1)}%</td><td></td></tr></tfoot>`
    :emptyBody(7,T('no_sales_sel')));
  drawPager('p-prod',iP,'prod'); wireSort('t-prod','prod');

  const byRev=prods.slice().sort((a,b)=>b.rev-a.rev);
  const cum=n=>byRev.slice(0,n).reduce((a,p)=>a+p.rev,0);
  el('t-conc').innerHTML=headers([{l:T('cc_top')},{l:T('c_revenue')},{l:T('c_share')}])+
    `<tbody>${[5,10,20,50].filter(n=>n<=byRev.length).map(n=>{
      const c=cum(n), sh=Tt.rev>0?100*c/Tt.rev:0;
      return `<tr><td class="pname">${T('cc_topn',n)}</td><td class="mono">${F(c,0)} ₾</td>
        <td><span class="mono" style="font-size:13px">${F(sh,1)}%</span>
        <span class="bar"><i style="width:${Math.min(100,sh)}%;background:var(--brand)"></i></span></td></tr>`;}).join('')}
      <tr><td class="pname">${T('cc_alln',F(byRev.length))}</td><td class="mono">${F(Tt.rev,0)} ₾</td>
        <td class="mono">100.0%</td></tr></tbody>`;

  const bands=[{l:T('mb_neg'),t:p=>p.mpct<0},{l:T('mb_u15'),t:p=>p.mpct>=0&&p.mpct<15},
    {l:T('mb_1530'),t:p=>p.mpct>=15&&p.mpct<30},{l:T('mb_3050'),t:p=>p.mpct>=30&&p.mpct<50},
    {l:T('mb_50'),t:p=>p.mpct>=50}];
  el('t-bands').innerHTML=headers([{l:T('mb_band')},{l:T('c_products')},{l:T('c_revenue')},
    {l:T('c_margin_gel')},{l:T('c_share')}])+
    `<tbody>${bands.map(b=>{const gp=prods.filter(b.t);
      const rev=gp.reduce((a,p)=>a+p.rev,0), mg=gp.reduce((a,p)=>a+p.margin,0), sh=Tt.rev>0?100*rev/Tt.rev:0;
      return `<tr><td class="pname">${b.l}</td><td class="mono">${gp.length}</td>
        <td class="mono">${F(rev,0)} ₾</td>
        <td class="mono"${mg<0?' style="color:var(--crit)"':''}>${F(mg,0)} ₾</td>
        <td><span class="mono" style="font-size:13px">${F(sh,1)}%</span>
        <span class="bar"><i style="width:${Math.min(100,sh)}%;background:${mg<0?'var(--crit)':'var(--brand)'}"></i></span></td></tr>`;}).join('')}</tbody>`;

  const scopeStock=STOCK.filter(st=>(!state.cat||st.c===state.cat)&&
    (!state.q||st.p.toLowerCase().includes(state.q)||String(st.b).includes(state.q)));
  const neg=scopeStock.filter(st=>st.q<0);
  el('neg-note').innerHTML=neg.length?T('neg_stock',neg.length,F(neg.reduce((a,st)=>a+st.q,0),1)):'';

  const prodBy=Object.fromEntries(prods.map(x=>[x.b,x]));
  const health=scopeStock.map(st=>{
    const r=L30[st.b]||{u:0,rev:0,cogs:0}, pr=prodBy[st.b];
    const perDay=r.u/30, perWeek=perDay*7;
    // TRUE unit margin. No floor: a floor would inflate the score of thin-margin,
    // high-ticket lines, which is exactly how a 642 GEL freezer reaches rank 2.
    const unitMargin=r.u>0?(r.rev-r.cogs)/r.u:(pr&&pr.units>0?pr.margin/pr.units:0);
    const cover=perDay>0?st.q/perDay:null;
    const suggest=Math.max(0,Math.ceil(perDay*30)-st.q);
    const orderValue=suggest*st.u;
    const atRisk=perDay>0?perWeek*Math.max(0,unitMargin)*
      Math.max(0,Math.min(1,1-(Math.max(0,st.q)/perDay)/21)):0;
    // Why a line is NOT a routine reorder. Order matters: a pass-through line is
    // never a stockout, whatever else is true of it.
    let reason=null;
    if(st.pt) reason='passthrough';
    else if(st.q<0) reason='count';
    else if(st.nocc<2) reason='oneoff';
    else if(unitMargin<=0) reason='reprice';
    return {b:st.b,p:st.p,c:st.c,sup:st.s,on_hand:st.q,unit_cost:st.u,capital:st.t,
      maxHeld:st.mx,received:st.rin,nocc:st.nocc,ulife:st.ulife,
      u30:r.u,rev30:r.rev,perWeek,cover,suggest,orderValue,unitMargin,reason,
      perGel:orderValue>0?atRisk/orderValue:0,
      turn:st.t>0?(r.cogs*12.1667)/st.t:0,
      periodRev:pr?pr.rev:0,periodMargin:pr?pr.margin:0,periodUnits:pr?pr.units:0,atRisk};});

  /* ---- what to order: proven, stocked lines only, ranked by cash efficiency ---- */
  const urgent=health.filter(h=>h.u30>0&&h.cover!=null&&h.cover<21);
  let order=sortRows(urgent.filter(h=>!h.reason),'order');
  let run=0; order.forEach(r=>{run+=r.orderValue; r.cum=run;});
  LAST.order=order;
  const iOrd=paginate(order,'order');
  el('t-order').innerHTML=order.length?
    headers([{l:T('c_product')},{l:T('c_supplier')},{l:T('c_occ'),k:'nocc'},
      {l:T('c_onhand'),k:'on_hand'},{l:T('c_maxheld'),k:'maxHeld'},{l:T('c_units30'),k:'u30'},
      {l:T('c_cover'),k:'cover'},{l:T('c_orderqty'),k:'suggest'},{l:T('c_ordervalue'),k:'orderValue'},
      {l:T('c_atrisk'),k:'atRisk'},{l:T('c_perlari'),k:'perGel'},{l:T('c_cumcash')}],'order')+
    `<tbody>${iOrd.slice.map(r=>{const sev=r.cover<=7?'crit':r.cover<=14?'warn':'good';
      return `<tr>
      <td><span class="pname" title="${esc(r.p)}">${esc(r.p)}</span><span class="pmeta" title="${esc(r.c)}">${esc(r.c)}</span></td>
      <td class="tleft"><span class="tcell" title="${esc(r.sup)}">${esc(r.sup)}</span></td>
      <td class="mono">${F(r.nocc,0)}</td>
      <td class="mono">${F(r.on_hand,0)}</td>
      <td class="mono" style="color:var(--ink-2)">${F(r.maxHeld,0)}</td>
      <td class="mono">${F(r.u30,0)}</td>
      <td class="chipcell"><span class="chip ${sev}"><span class="dot"></span>${r.cover<1?T('o_outchip'):F(r.cover,0)+T('u_day')}</span></td>
      <td class="mono" style="font-weight:600">${F(r.suggest,0)}</td>
      <td class="mono">${F(r.orderValue,0)} \u20BE</td>
      <td class="mono" style="color:var(--brand-deep);font-weight:600">${F(r.atRisk,1)} \u20BE</td>
      <td class="mono">${F(r.perGel,3)}</td>
      <td class="mono" style="color:var(--ink-2)">${F(r.cum,0)} \u20BE</td></tr>`;}).join('')}</tbody>
      <tfoot><tr><td>${T('o_toorder',order.length)}</td><td></td><td></td><td></td><td></td><td></td><td></td>
        <td class="mono">${F(order.reduce((a,r)=>a+r.suggest,0),0)}</td>
        <td class="mono">${F(order.reduce((a,r)=>a+r.orderValue,0),0)} \u20BE</td>
        <td class="mono">${F(order.reduce((a,r)=>a+r.atRisk,0),1)} \u20BE</td><td></td><td></td></tr></tfoot>`
    :emptyBody(12,T('o_none2'));
  drawPager('p-order',iOrd,'order'); wireSort('t-order','order');

  const outNow=order.filter(r=>r.on_hand<=0), supN=new Set(order.map(r=>r.sup)).size;
  el('order-stats').innerHTML=[
    {lab:T('o_lines'),val:F(order.length),sub:supN===1?T('o_supplier1',supN):T('o_suppliers',supN)},
    {lab:T('o_out'),val:F(outNow.length),sub:T('o_out_sub')},
    {lab:T('o_value'),val:GEL(order.reduce((a,r)=>a+r.orderValue,0)),sub:T('o_value_sub')},
    {lab:T('o_risk'),val:GEL(order.reduce((a,r)=>a+r.atRisk,0)),sub:T('o_risk_sub')},
  ].map(x=>`<div class="stat"><span class="lab">${x.lab}</span><span class="val">${x.val}</span>
    <span class="sub">${x.sub}</span></div>`).join('');

  /* ---- needs a decision: excluded on purpose, never totalled ---- */
  const RSN={passthrough:['nd_passthrough','nd_passthrough_t','warn'],
             oneoff:['nd_oneoff','nd_oneoff_t','warn'],
             count:['nd_count','nd_count_t','crit'],
             reprice:['nd_reprice','nd_reprice_t','crit']};
  const decide=sortRows(urgent.filter(h=>h.reason)
    .map(h=>Object.assign({},h,{reasonText:T(RSN[h.reason][0])})),'decide');
  LAST.decide=decide;
  const iDec=paginate(decide,'decide');
  el('t-decide').innerHTML=decide.length?
    headers([{l:T('c_product')},{l:T('nd_reason')},{l:T('c_supplier')},{l:T('c_occ'),k:'nocc'},
      {l:T('c_onhand'),k:'on_hand'},{l:T('c_units30'),k:'u30'},{l:T('c_unitcost'),k:'unit_cost'}],'decide')+
    `<tbody>${iDec.slice.map(r=>{const R=RSN[r.reason];
      return `<tr>
      <td><span class="pname" title="${esc(r.p)}">${esc(r.p)}</span><span class="pmeta" title="${esc(r.c)}">${esc(r.c)}</span></td>
      <td class="chipcell"><span class="chip ${R[2]}" title="${esc(T(R[1]))}"><span class="dot"></span>${T(R[0])}</span></td>
      <td class="tleft"><span class="tcell" title="${esc(r.sup)}">${esc(r.sup)}</span></td>
      <td class="mono">${F(r.nocc,0)}</td>
      <td class="mono"${r.on_hand<0?' style="color:var(--crit)"':''}>${F(r.on_hand,0)}</td>
      <td class="mono">${F(r.u30,0)}</td>
      <td class="mono">${F(r.unit_cost,2)} \u20BE</td></tr>`;}).join('')}</tbody>`
    :emptyBody(7,T('nd_none'));
  drawPager('p-decide',iDec,'decide'); wireSort('t-decide','decide');

  const over=sortRows(health.filter(h=>h.capital>0&&
      ((h.cover!=null&&h.cover>365)||(h.u30===0&&h.on_hand>0&&(prodBy[h.b]||{units:0}).units>0))),'over');
  LAST.over=over;
  const iO=paginate(over,'over');
  el('t-over').innerHTML=over.length?
    headers([{l:T('c_product')},{l:T('c_onhand'),k:'on_hand'},{l:T('c_maxheld'),k:'maxHeld'},
      {l:T('c_stockvalue'),k:'capital'},{l:T('c_units30'),k:'u30'},{l:T('c_perunits'),k:'periodUnits'},
      {l:T('c_perrev'),k:'periodRev'},{l:T('c_permargin'),k:'periodMargin'},
      {l:T('c_cover'),k:'cover'},{l:T('c_turns'),k:'turn'}],'over')+
    `<tbody>${iO.slice.map(r=>`<tr>
      <td><span class="pname" title="${esc(r.p)}">${esc(r.p)}</span><span class="pmeta" title="${esc(r.c)} · ${esc(r.sup)}">${esc(r.c)} · ${esc(r.sup)}</span></td>
      <td class="mono">${F(r.on_hand,0)}</td>
      <td class="mono" style="color:var(--ink-2)">${F(r.maxHeld,0)}</td>
      <td class="mono" style="font-weight:600">${F(r.capital,0)} ₾</td>
      <td class="mono"${r.u30===0?' style="color:var(--crit)"':''}>${F(r.u30,0)}</td>
      <td class="mono">${F(r.periodUnits,0)}</td><td class="mono">${F(r.periodRev,0)} ₾</td>
      <td class="mono">${F(r.periodMargin,0)} ₾</td>
      <td class="chipcell"><span class="chip warn"><span class="dot"></span>${r.cover==null?T('ov_nodemand'):r.cover>3650?T('ov_10y'):T('ov_y',F(r.cover/365,1))}</span></td>
      <td class="mono">${F(r.turn,2)}×</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>${T('n_products',over.length)}</td><td></td>
        <td class="mono">${F(over.reduce((a,r)=>a+r.maxHeld,0),0)}</td>
        <td class="mono">${F(over.reduce((a,r)=>a+r.capital,0),0)} ₾</td>
        <td class="mono">${F(over.reduce((a,r)=>a+r.u30,0),0)}</td>
        <td class="mono">${F(over.reduce((a,r)=>a+r.periodUnits,0),0)}</td>
        <td class="mono">${F(over.reduce((a,r)=>a+r.periodRev,0),0)} ₾</td>
        <td class="mono">${F(over.reduce((a,r)=>a+r.periodMargin,0),0)} ₾</td><td></td><td></td></tr></tfoot>`
    :emptyBody(10,T('ov_none'));
  drawPager('p-over',iO,'over'); wireSort('t-over','over');

  const stalled=over.filter(r=>r.u30===0);
  el('over-stats').innerHTML=[
    {lab:T('ov_lines'),val:F(over.length),sub:T('ov_lines_sub')},
    {lab:T('ov_capital'),val:GEL(over.reduce((a,r)=>a+r.capital,0)),sub:T('ov_capital_sub')},
    {lab:T('ov_nosale'),val:F(stalled.length),sub:T('ov_nosale_sub')},
    {lab:T('ov_earned'),val:GEL(over.reduce((a,r)=>a+r.periodMargin,0)),sub:T('ov_earned_sub')},
  ].map(x=>`<div class="stat"><span class="lab">${x.lab}</span><span class="val">${x.val}</span>
    <span class="sub">${x.sub}</span></div>`).join('');

  const sold=new Set(rows.map(l=>l.b));
  LAST.dead=scopeStock.filter(st=>st.q>0&&!sold.has(st.b)).sort((a,b)=>b.t-a.t);
  const deadCap=LAST.dead.reduce((a,st)=>a+st.t,0), scopeCap=scopeStock.reduce((a,st)=>a+st.t,0);
  const allTime=state.period==='all'&&!state.chan;
  el('dead-h').textContent=allTime?T('d_title_all'):T('d_title_period');
  el('dead-big').textContent=GEL(deadCap)+'  ·  '+T('n_products',F(LAST.dead.length));
  el('dead-p').innerHTML=LAST.dead.length
    ? T('d_body',F(LAST.dead.length),allTime?T('d_never'):T('d_notperiod'),GEL(deadCap),
        scopeCap>0?F(100*deadCap/scopeCap,1):'0',GEL(scopeCap))
    : T('d_allsold');
  const iD=paginate(LAST.dead,'dead');
  el('t-dead').innerHTML=iD.slice.length?
    headers([{l:T('c_product')},{l:T('c_supplier')},{l:T('c_qty')},{l:T('c_maxheld')},
      {l:T('c_unitcost')},{l:T('c_capital')}])+
    `<tbody>${iD.slice.map(r=>`<tr>
      <td><span class="pname" title="${esc(r.p)}">${esc(r.p)}</span><span class="pmeta" title="${esc(r.c)}">${esc(r.c)}</span></td>
      <td class="tleft"><span class="tcell" title="${esc(r.s)}">${esc(r.s)}</span></td>
      <td class="mono">${F(r.q,0)}</td>
      <td class="mono" style="color:var(--ink-2)">${F(r.mx,0)}</td>
      <td class="mono">${F(r.u,2)}</td>
      <td class="mono" style="font-weight:500">${F(r.t,0)} ₾</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>${T('n_products',LAST.dead.length)}</td><td></td><td></td><td></td><td></td>
      <td class="mono">${F(deadCap,0)} ₾</td></tr></tfoot>`:'';
  drawPager('p-dead',iD,'dead');

  let catRows=[...groupBy(rows,l=>l.c).entries()].map(e=>{const t=totals(e[1]);
    return {cat:e[0],rev:t.rev,units:t.units,margin:t.margin,mpct:t.mpct,
      skus:new Set(e[1].map(l=>l.b)).size,share:Tt.rev>0?100*t.rev/Tt.rev:0};});
  catRows=sortRows(catRows,'cat');
  const iC=paginate(catRows,'cat');
  el('t-cat').innerHTML=headers([{l:T('c_category')},{l:T('c_revenue'),k:'rev'},{l:T('c_units'),k:'units'},
    {l:T('c_products'),k:'skus'},{l:T('c_margin_gel'),k:'margin'},{l:T('c_margin_pct'),k:'mpct'},
    {l:T('c_share'),k:'share'}],'cat')+
    (iC.slice.length?`<tbody>${iC.slice.map(r=>`<tr>
      <td><span class="pname" title="${esc(r.cat)}">${esc(r.cat)}</span></td>
      <td class="mono">${F(r.rev,0)} ₾</td><td class="mono">${F(r.units,0)}</td><td class="mono">${r.skus}</td>
      <td class="mono">${F(r.margin,0)} ₾</td>
      <td class="mono"${r.mpct<20?' style="color:var(--brand-deep)"':''}>${F(r.mpct,1)}%</td>
      <td><span class="mono" style="font-size:13px">${F(r.share,1)}%</span>
      <span class="bar"><i style="width:${Math.min(100,r.share)}%;background:var(--brand)"></i></span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td>${T('n_categories',catRows.length)}</td><td class="mono">${F(Tt.rev,0)} ₾</td>
      <td class="mono">${F(Tt.units,0)}</td><td></td><td class="mono">${F(Tt.margin,0)} ₾</td>
      <td class="mono">${F(Tt.mpct,1)}%</td><td class="mono">100%</td></tr></tfoot>`
    :emptyBody(5,T('no_data')));
  drawPager('p-cat',iC,'cat'); wireSort('t-cat','cat');

  const dow=[1,2,3,4,5,6,7].map(i=>{const t=totals(rows.filter(l=>l.w===i));
    return {n:T('dow_'+i),rev:t.rev,receipts:t.receipts,basket:t.basket};}).filter(r=>r.receipts>0);
  const maxD=Math.max(...dow.map(d=>d.rev),1);
  el('t-dow').innerHTML=dow.length?
    headers([{l:T('c_day')},{l:T('c_revenue')},{l:T('k_receipts')},{l:T('k_basket')},{l:T('c_share')}])+
    `<tbody>${dow.map(d=>`<tr><td class="pname">${d.n}</td>
      <td class="mono">${F(d.rev,0)} ₾</td><td class="mono">${d.receipts}</td>
      <td class="mono">${F(d.basket,0)} ₾</td>
      <td><span class="bar" style="min-width:86px"><i style="width:${(d.rev/maxD)*100}%;background:var(--brand)"></i></span></td></tr>`).join('')}</tbody>`
    :emptyBody(5,T('no_data'));

  const ch=[...groupBy(rows,l=>l.ch).entries()].map(e=>{const t=totals(e[1]);
    return {k:e[0]==='retail'?T('ch_retail_full'):T('ch_entity_full'),rev:t.rev,mpct:t.mpct,
      receipts:t.receipts,share:Tt.rev>0?100*t.rev/Tt.rev:0};}).sort((a,b)=>b.rev-a.rev);
  el('t-chan').innerHTML=ch.length?
    headers([{l:T('c_channel')},{l:T('c_revenue')},{l:T('k_receipts')},{l:T('c_margin_pct')},{l:T('c_share')}])+
    `<tbody>${ch.map(r=>`<tr><td class="pname">${r.k}</td>
      <td class="mono">${F(r.rev,0)} ₾</td><td class="mono">${r.receipts}</td>
      <td class="mono">${F(r.mpct,1)}%</td><td class="mono">${F(r.share,1)}%</td></tr>`).join('')}</tbody>`
    :emptyBody(5,T('no_data'));
}

const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
  document.querySelectorAll('.nav a').forEach(a=>
    a.setAttribute('aria-current',a.getAttribute('href')==='#'+e.target.id));}});},
  {rootMargin:'-15% 0px -70% 0px',threshold:0});

let rzT; window.addEventListener('resize',()=>{clearTimeout(rzT); rzT=setTimeout(render,180);});
document.documentElement.setAttribute('lang',LANG);
paintStatic();
NAV.forEach(n=>{const el0=el(n[0]); if(el0) obs.observe(el0);});
render();
</script>
